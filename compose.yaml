  services:
    db:
      image: postgres:16
      environment:
        POSTGRES_DB: todo
        POSTGRES_USER: todo_user
        POSTGRES_PASSWORD: local_dev_password
      ports:
        - "5456:5432"
      volumes:
        - todo_postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U todo_user -d todo"]
        interval: 5s
        timeout: 5s
        retries: 10

    app:
      build:
        context: .
        dockerfile: Dockerfile
      ports:
        - "8082:8082"
      environment:
        DB_NAME: todo
        DB_USER: todo_user
        DB_PASSWORD: local_dev_password
        JAVA_OPTS: "-Dconfig.resource=docker.conf"
      depends_on:
        db:
          condition: service_healthy

  volumes:
    todo_postgres_data: